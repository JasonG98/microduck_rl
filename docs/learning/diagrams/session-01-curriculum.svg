<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="100%" height="auto" role="img" aria-label="课程进度随训练迭代的变化" font-family="'SF Pro Text','PingFang SC',system-ui,sans-serif">
  <rect width="720" height="330" fill="#FFFFFF"/>
  <style>
    .title{font-size:16px;font-weight:600;fill:#171717;}
    .cap{font-size:12px;fill:#52525B;}
    .name{font-size:14px;font-weight:500;fill:#171717;}
    .sub{font-size:12px;fill:#52525B;font-family:monospace;}
    .lane{stroke:#D8D8DE;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .lane-f{stroke:#4B3FE3;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
    .dot{fill:#52525B;}
    .dot-f{fill:#4B3FE3;}
    .grid{stroke:#E4E4E9;stroke-width:0.75;stroke-dasharray:3 4;fill:none;}
    .axis{stroke:#D8D8DE;stroke-width:1.5;fill:none;}
    .val{font-size:13px;font-weight:500;fill:#171717;font-family:monospace;}
    .axl{font-size:12px;fill:#52525B;}
  </style>

  <text class="title" x="40" y="30">课程（Curriculum）：随迭代逐步放水</text>
  <text class="cap" x="40" y="54">x 轴 = 训练迭代；每条车道 = 一个课程的参数值从低到高</text>

  <g>
    <line class="grid" x1="180" y1="62" x2="180" y2="286"/>
    <line class="grid" x1="295" y1="62" x2="295" y2="286"/>
    <line class="grid" x1="318" y1="62" x2="318" y2="286"/>
    <line class="grid" x1="353" y1="62" x2="353" y2="286"/>
    <line class="grid" x1="410" y1="62" x2="410" y2="286"/>
    <line class="grid" x1="468" y1="62" x2="468" y2="286"/>
    <line class="grid" x1="525" y1="62" x2="525" y2="286"/>
    <line class="grid" x1="640" y1="62" x2="640" y2="286"/>
  </g>

  <g>
    <text class="name" x="176" y="75" text-anchor="end">动作平滑权重</text>
    <text class="sub" x="176" y="92" text-anchor="end">action_rate_l2</text>
    <line class="lane" x1="180" y1="80" x2="640" y2="80"/>
    <polyline class="lane-f" points="180,80 295,78.2 353,74.7 410,71.1 468,67.6 525,64"/>
    <circle class="dot-f" cx="180" cy="80" r="3"/><circle class="dot-f" cx="295" cy="78.2" r="3"/><circle class="dot-f" cx="353" cy="74.7" r="3"/><circle class="dot-f" cx="410" cy="71.1" r="3"/><circle class="dot-f" cx="468" cy="67.6" r="3"/><circle class="dot-f" cx="525" cy="64" r="3"/>
    <text class="val" x="650" y="84">−1.0</text>
  </g>

  <g>
    <text class="name" x="176" y="121" text-anchor="end">站立环境比例</text>
    <text class="sub" x="176" y="138" text-anchor="end">standing_envs</text>
    <line class="lane" x1="180" y1="126" x2="640" y2="126"/>
    <polyline class="lane" points="180,126 295,123.9 353,120.4 410,117 525,113.5 640,110"/>
    <circle class="dot" cx="180" cy="126" r="2.5"/><circle class="dot" cx="295" cy="123.9" r="2.5"/><circle class="dot" cx="353" cy="120.4" r="2.5"/><circle class="dot" cx="410" cy="117" r="2.5"/><circle class="dot" cx="525" cy="113.5" r="2.5"/><circle class="dot" cx="640" cy="110" r="2.5"/>
    <text class="val" x="650" y="130">25%</text>
  </g>

  <g>
    <text class="name" x="176" y="167" text-anchor="end">头部指令范围</text>
    <text class="sub" x="176" y="184" text-anchor="end">head_pose_range</text>
    <line class="lane" x1="180" y1="172" x2="640" y2="172"/>
    <polyline class="lane" points="180,172 295,170.3 410,166.9 525,161.9 640,156"/>
    <circle class="dot" cx="180" cy="172" r="2.5"/><circle class="dot" cx="295" cy="170.3" r="2.5"/><circle class="dot" cx="410" cy="166.9" r="2.5"/><circle class="dot" cx="525" cy="161.9" r="2.5"/><circle class="dot" cx="640" cy="156" r="2.5"/>
    <text class="val" x="650" y="176">100%</text>
  </g>

  <g>
    <text class="name" x="176" y="213" text-anchor="end">CoM 随机化</text>
    <text class="sub" x="176" y="230" text-anchor="end">com_range</text>
    <line class="lane" x1="180" y1="218" x2="640" y2="218"/>
    <polyline class="lane" points="180,218 295,215.3 410,208.7 525,202"/>
    <circle class="dot" cx="180" cy="218" r="2.5"/><circle class="dot" cx="295" cy="215.3" r="2.5"/><circle class="dot" cx="410" cy="208.7" r="2.5"/><circle class="dot" cx="525" cy="202" r="2.5"/>
    <text class="val" x="650" y="222">15mm</text>
  </g>

  <g>
    <text class="name" x="176" y="259" text-anchor="end">头部偏置惩罚</text>
    <text class="sub" x="176" y="276" text-anchor="end">head_pose_bias</text>
    <line class="lane" x1="180" y1="264" x2="640" y2="264"/>
    <polyline class="lane" points="180,264 318,258.7 410,253.3 525,248"/>
    <circle class="dot" cx="180" cy="264" r="2.5"/><circle class="dot" cx="318" cy="258.7" r="2.5"/><circle class="dot" cx="410" cy="253.3" r="2.5"/><circle class="dot" cx="525" cy="248" r="2.5"/>
    <text class="val" x="650" y="268">3.0</text>
  </g>

  <line class="axis" x1="180" y1="300" x2="640" y2="300"/>
  <line class="axis" x1="180" y1="300" x2="180" y2="306"/>
  <line class="axis" x1="295" y1="300" x2="295" y2="306"/>
  <line class="axis" x1="410" y1="300" x2="410" y2="306"/>
  <line class="axis" x1="525" y1="300" x2="525" y2="306"/>
  <line class="axis" x1="640" y1="300" x2="640" y2="306"/>
  <text class="axl" x="180" y="320" text-anchor="middle">0</text>
  <text class="axl" x="295" y="320" text-anchor="middle">500</text>
  <text class="axl" x="410" y="320" text-anchor="middle">1000</text>
  <text class="axl" x="525" y="320" text-anchor="middle">1500</text>
  <text class="axl" x="640" y="320" text-anchor="middle">2000</text>
</svg>
