<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="100%" height="auto" role="img" aria-label="GAE 数值计算例子" font-family="'SF Pro Text','PingFang SC',system-ui,sans-serif">
  <rect width="720" height="310" fill="#FFFFFF"/>
  <style>
    .title{font-size:16px;font-weight:600;fill:#171717;}
    .sub{font-size:12px;fill:#52525B;}
    .thead{font-size:12px;font-weight:500;fill:#52525B;}
    .thead-f{font-size:12px;font-weight:500;fill:#4B3FE3;}
    .cell{font-size:13px;font-weight:500;fill:#171717;font-family:monospace;}
    .cell-t{font-size:13px;font-weight:500;fill:#52525B;}
    .cell-f{font-size:13px;font-weight:500;fill:#1A1759;font-family:monospace;}
    .focus{fill:#F2F7FF;}
    .hline{stroke:#D8D8DE;}
    .rowline{stroke:#E4E4E9;}
    .vline{stroke:#D8D8DE;}
    .foot{font-size:12px;fill:#52525B;}
  </style>

  <text class="title" x="40" y="28">GAE 数值例子（γ=0.99, λ=0.95）</text>
  <text class="sub" x="40" y="48">最后一步用现算的 V(s₄)=1.80 续值；δ = r + γ·V(s′) − V(s)；A 从后往前倒推</text>

  <line class="hline" x1="40" y1="58" x2="680" y2="58"/>
  <text class="thead" x="48" y="76">t（倒序）</text>
  <text class="thead" x="130" y="76">r_t</text>
  <text class="thead" x="186" y="76">V(s_t)</text>
  <text class="thead" x="250" y="76">δ_t</text>
  <text class="thead-f" x="460" y="76">A_t 优势</text>
  <text class="thead" x="646" y="76">R_t</text>
  <line class="hline" x1="40" y1="84" x2="680" y2="84"/>
  <line class="vline" x1="120" y1="84" x2="120" y2="260"/>
  <line class="vline" x1="176" y1="84" x2="176" y2="260"/>
  <line class="vline" x1="232" y1="84" x2="232" y2="260"/>
  <line class="vline" x1="450" y1="84" x2="450" y2="260"/>
  <line class="vline" x1="636" y1="84" x2="636" y2="260"/>

  <g>
    <rect class="focus" x="450" y="84" width="186" height="44"/>
    <text class="cell-t" x="48" y="111">3</text>
    <text class="cell" x="130" y="111">1.00</text>
    <text class="cell" x="186" y="111">1.50</text>
    <text class="cell" x="242" y="111">1.00 + 0.99×1.80 − 1.50 = 1.282</text>
    <text class="cell-f" x="460" y="103">A₃ = δ₃</text>
    <text class="cell-f" x="460" y="120">= 1.282</text>
    <text class="cell" x="646" y="111">2.782</text>
    <line class="rowline" x1="40" y1="128" x2="680" y2="128"/>
  </g>

  <g>
    <rect class="focus" x="450" y="128" width="186" height="44"/>
    <text class="cell-t" x="48" y="155">2</text>
    <text class="cell" x="130" y="155">0.20</text>
    <text class="cell" x="186" y="155">1.30</text>
    <text class="cell" x="242" y="155">0.20 + 0.99×1.50 − 1.30 = 0.385</text>
    <text class="cell-f" x="460" y="147">A₂ = δ₂ + γλ·A₃</text>
    <text class="cell-f" x="460" y="164">= 0.385 + 1.206 = 1.591</text>
    <text class="cell" x="646" y="155">2.891</text>
    <line class="rowline" x1="40" y1="172" x2="680" y2="172"/>
  </g>

  <g>
    <rect class="focus" x="450" y="172" width="186" height="44"/>
    <text class="cell-t" x="48" y="199">1</text>
    <text class="cell" x="130" y="199">0.80</text>
    <text class="cell" x="186" y="199">1.10</text>
    <text class="cell" x="242" y="199">0.80 + 0.99×1.30 − 1.10 = 0.987</text>
    <text class="cell-f" x="460" y="191">A₁ = δ₁ + γλ·A₂</text>
    <text class="cell-f" x="460" y="208">= 0.987 + 1.496 = 2.483</text>
    <text class="cell" x="646" y="199">3.583</text>
    <line class="rowline" x1="40" y1="216" x2="680" y2="216"/>
  </g>

  <g>
    <rect class="focus" x="450" y="216" width="186" height="44"/>
    <text class="cell-t" x="48" y="243">0</text>
    <text class="cell" x="130" y="243">0.50</text>
    <text class="cell" x="186" y="243">0.90</text>
    <text class="cell" x="242" y="243">0.50 + 0.99×1.10 − 0.90 = 0.689</text>
    <text class="cell-f" x="460" y="235">A₀ = δ₀ + γλ·A₁</text>
    <text class="cell-f" x="460" y="252">= 0.689 + 2.335 = 3.025</text>
    <text class="cell" x="646" y="243">3.925</text>
  </g>

  <text class="foot" x="40" y="282">A₀ = 0.689 + 0.9405×0.987 + 0.9405²×0.385 + 0.9405³×1.282 ≈ 3.025 —— 越靠前，后续 δ 的衰减加权叠得越多</text>
  <text class="foot" x="40" y="300">A 列（品牌底）→ 喂给 surrogate 更新策略；R 列 = A + V → 喂给 critic 当回归目标</text>
</svg>
